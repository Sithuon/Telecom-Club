<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Telecommunication Club is one place to find telecom courses, learn from working engineers and join a free community of learners.">
  <meta name="theme-color" content="#06182F">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Telecommunication Club">
  <meta property="og:description" content="Learn telecom. Build what's next. Free courses, mentors and a community for anyone curious about telecom.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Telecom Club">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Telecommunication Club · Learn telecom, together</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #06182F;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        radial-gradient(circle at 82% 18%, rgba(0, 180, 216, 0.22), transparent 45%),
        linear-gradient(135deg, #030E1D 0%, #082448 55%, #0B3D91 100%);
      color: #ffffff;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      transition: opacity 320ms ease;
    }

    #splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-mark {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #0B3D91, #00B4D8);
      box-shadow: 0 18px 50px rgba(0, 180, 216, 0.35);
      animation: splash-pulse 2.4s ease-in-out infinite;
    }

    @keyframes splash-pulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .splash-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .splash-sub {
      margin-top: -10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.48);
    }

    .splash-bar {
      width: 132px;
      height: 3px;
      margin-top: 8px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
    }

    .splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #00B4D8, #2DD4BF);
      animation: splash-slide 1.4s ease-in-out infinite;
    }

    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <path d="M4.5 11.5a10.5 10.5 0 0 1 15 0" opacity="0.55"/>
        <path d="M7.5 15a6.5 6.5 0 0 1 9 0"/>
        <circle cx="12" cy="18.6" r="1.3" fill="#ffffff" stroke="none"/>
      </svg>
    </div>
    <div class="splash-title">Telecommunication Club</div>
    <div class="splash-sub">Learn · Connect · Build</div>
    <div class="splash-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
